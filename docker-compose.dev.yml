services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: outlier
      POSTGRES_PASSWORD: change_this_password
      POSTGRES_DB: outlier_academy
    ports:
      - "5432:5432"
    volumes:
      - outlier_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outlier -d outlier_academy"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  outlier_pgdata:
